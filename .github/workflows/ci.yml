name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # RUSTC_WRAPPER is deliberately not set here. It used to be `sccache`, which
  # put that binary in front of rustc in every job -- including the ones that
  # never install it. There cargo could not even launch the compiler
  # (`could not execute process `sccache .../rustc -vV` (never executed)`), and
  # cargo-deny reported that as "failed to fetch crates", which reads like a
  # dependency problem and is nothing of the kind. Jobs that install sccache
  # opt in to the wrapper individually; the rest compile without a cache.

jobs:
  # ─── Format Check ───────────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # ─── Clippy Lint ────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.4
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libudev-dev
      - name: Clippy lint check
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ─── Test Suite (nextest, sharded ×4) ────────────────────────────────────
  test:
    name: Tests (shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-nextest
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libudev-dev
      - name: Run tests (nextest shard ${{ matrix.shard }}/${{ matrix.total }})
        run: >
          cargo nextest run
          --workspace --all-features
          --profile ci
          --partition count:${{ matrix.shard }}/${{ matrix.total }}
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-shard-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml
          retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-shard-*
          merge-multiple: true
      - name: Publish test report
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "junit.xml"
          check_name: "Nextest Results"
          summary: true

  # ─── Quarantined / Flaky Tests ──────────────────────────────────────────
  test-quarantine:
    name: Quarantined Tests (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: test-summary
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-nextest
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libudev-dev
      - name: Run quarantined tests (if any)
        run: |
          # Read filter expressions from the quarantine list and run them.
          # The leading-# filter matters: the file documents its format with a
          # commented-out `filter = "..."` example, and `grep` alone matched it.
          # This job then ran a filter for a test that does not exist, which
          # nextest reports as `error: no tests to run` (advisory exit code 4),
          # so an empty quarantine list read as a failed job instead of the
          # no-op its comment claims it is.
          QUARANTINE_FILTERS=$(grep -v '^[[:space:]]*#' .config/flaky-quarantine.toml | grep 'filter = ' | sed 's/.*filter = "\(.*\)"/\1/' | tr '\n' '|' || true)
          QUARANTINE_FILTERS="${QUARANTINE_FILTERS%|}"
          if [ -n "$QUARANTINE_FILTERS" ]; then
            # --no-tests pass: an entry whose test has since been renamed is
            # stale bookkeeping, not a broken build (nextest's default is `fail`,
            # which is the exit code 4 this job used to report).
            cargo nextest run --workspace --profile ci --no-tests pass -E "test($QUARANTINE_FILTERS)"
          else
            echo "No quarantined tests to run."
          fi
      - name: Upload quarantine JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-quarantine
          path: target/nextest/ci/junit.xml
          retention-days: 7

  # ─── Flaky Test Detection ───────────────────────────────────────────────
  flaky-detect:
    name: Flaky Test Detection
    runs-on: ubuntu-latest
    needs: test-summary
    if: always()
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-shard-*
          merge-multiple: true
          path: target/nextest/ci/
      - name: Detect flaky tests
        run: |
          pwsh detect_flaky.ps1 -JUnitDir target/nextest/ci -HistoryDir .flaky-history
        continue-on-error: true
      - name: Upload flaky history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-history
          path: .flaky-history/
          retention-days: 30

  # ─── Build Release ──────────────────────────────────────────────────────
  build-release:
    name: Release Build
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
    needs: [fmt, clippy, test-summary]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.4
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libudev-dev
      - name: Build release binaries
        run: cargo build --release
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: velocity-release-linux
          path: |
            target/release/velocity_ide
            target/release/velocity_mcp
            target/release/velocity_ide_gui
            target/release/velocity-drone
          retention-days: 30

  # ─── Security Audit ─────────────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - name: Run security audit
        run: cargo audit

  # ─── Dependency Policy (cargo-deny) ─────────────────────────────────────
  deny:
    name: Dependency Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - name: Check dependency licenses and advisories
        run: cargo deny check

  # ─── Coverage (enforced thresholds) ──────────────────────────────────────
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libudev-dev
      - name: Generate coverage (lcov for Codecov)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Enforce workspace coverage threshold
        # The text summary doubles as the record of what this job measured, so
        # it goes to the run page as well as the log. `pipefail` because the
        # default shell here is `bash -e` without it, and a threshold failure
        # reaching the end of a pipe must not be swallowed by `tee`'s status.
        run: |
          set -o pipefail
          cargo llvm-cov --workspace --summary-only --fail-under-lines 45 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          fail_ci_if_error: false

  # ─── Benchmark Regression Detection ─────────────────────────────────────
  bench:
    name: Benchmark Regression
    runs-on: ubuntu-latest
    # Only run on PRs to avoid noise from main-branch commits
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Need full history for baseline comparison
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libudev-dev
      - name: Run benchmarks (current)
        run: cargo bench --workspace -- --noplot --save-baseline current
      - name: Checkout base branch and run benchmarks
        run: |
          git checkout ${{ github.base_ref }}
          cargo bench --workspace -- --noplot --save-baseline base
      - name: Compare benchmarks (Criterion built-in)
        run: |
          git checkout ${{ github.head_ref }}
          cargo bench --workspace -- --noplot --baseline base --load-baseline current
        continue-on-error: true
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: target/criterion/
          retention-days: 14

  # ─── Live GUI Sweep (Windows desktop) ─────────────────────────────────────
  # The only thing here that answers "have you actually pressed every button":
  # it builds the real binary, starts it against a throwaway workspace and drives
  # every control the running app itself reports, asserting on the follow-up
  # state and on pixels. Everything else in this workflow runs on Linux, and the
  # capture, the window handling and the bridge's Win32 side cannot be exercised
  # there at all -- `cargo test` covers the handlers, not the frame they draw in.
  gui-sweep:
    name: GUI Sweep (Windows)
    runs-on: windows-latest
    needs: [clippy]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the release binary
        run: cargo build --release -p velocity-ide-gui

      # Blocking: a sweep script that cannot parse has covered nothing, silently,
      # for exactly as long as nobody ran it. Parsing costs four seconds.
      - name: Sweep script parses
        shell: pwsh
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/sweep_gui.ps1", [ref]$null, [ref]$errs)
          if ($errs.Count -gt 0) {
            $errs | ForEach-Object { "::error::sweep_gui.ps1:$($_.Extent.StartLineNumber) $($_.Message)" }
            exit 1
          }
          'sweep_gui.ps1 parses'

      - name: Launch the instance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'target\gui-sweep-ci-workspace' | Out-Null
          $started = Get-Date
          Start-Process "$PWD\target\release\velocity_ide_gui.exe" `
            -ArgumentList '--workspace', "$PWD\target\gui-sweep-ci-workspace" -WindowStyle Minimized
          $token = "$PWD\target\gui-sweep-ci-workspace\.velocity\gui_control.token"
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $token)) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path $token)) {
            "::error::the instance never opened the control bridge. Either it cannot create a window on this runner (no GL-capable display) or startup has regressed."
            Get-Process velocity_ide_gui -ErrorAction SilentlyContinue | Format-Table Id, Responding, StartTime
            exit 1
          }
          "bridge token written after $([int]((Get-Date).Subtract($started).TotalSeconds))s"

      # Not blocking yet, and deliberately so: this is the first run on a runner
      # with no display adapter, so "the sweep failed" and "this VM cannot host an
      # eframe window" are still distinguishable only by reading the log.
      # Promotion criterion: drop continue-on-error once two consecutive runs
      # finish with `failed 0` and a non-zero count of PASS lines in phase 13.
      - name: Sweep every control
        continue-on-error: true
        shell: pwsh
        run: |
          .\sweep_gui.ps1 -AllowUnsafe `
            -TokenFile "$PWD\target\gui-sweep-ci-workspace\.velocity\gui_control.token" `
            -Report "$PWD\sweep-ci-report.txt"
          "sweep exit code: $LASTEXITCODE"

      - name: Report the counts
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path "$PWD\sweep-ci-report.txt")) { '::warning::no sweep report was written'; exit 0 }
          Get-Content "$PWD\sweep-ci-report.txt" | Select-String -Pattern 'passed \d+\s+failed|FAIL |SKIP |overlay on:|overlay off:' |
            ForEach-Object { $_.Line } | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          Get-Content "$PWD\sweep-ci-report.txt" | Select-String -Pattern '^  FAIL' | ForEach-Object { "::warning::$($_.Line.Trim())" }

      - name: Stop the instance
        if: always()
        shell: pwsh
        run: Stop-Process -Name velocity_ide_gui -Force -ErrorAction SilentlyContinue

      - name: Upload the sweep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-sweep-report
          path: |
            sweep-ci-report.txt
            target/gui-sweep-ci-workspace/sweep-*.png
            target/gui-sweep-ci-workspace/sweep-*.rs
          retention-days: 14
          if-no-files-found: warn
