[package]
name = "velocity-workflow-core"
version = "0.1.0"
edition = "2021"
description = "Core types and traits for the Velocity Workflow Engine"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
async-trait = "0.1"
tokio = { version = "1.0", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
