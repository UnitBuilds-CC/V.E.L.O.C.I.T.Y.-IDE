[package]
name = "velocity-drone"
version = "1.0.0"
edition = "2021"
authors = ["UnitBuilds <ian@unitbuilds.com>"]
description = "Lightweight portable agent endpoint for cross-device V.E.L.O.C.I.T.Y. collaboration"
license = "LicenseRef-Proprietary"

[[bin]]
name = "velocity-drone"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winuser", "wingdi", "winbase", "winerror",
    "iphlpapi", "iptypes", "winsock2", "ntdef",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
