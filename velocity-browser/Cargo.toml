[package]
name = "velocity-browser"
version = "1.0.0"
edition = "2021"

[dependencies]
velocity-ide = { path = "../velocity-ide" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
# TLS 1.3 trust boundary. Reuses the `ring` provider already locked via `ureq`
# in velocity-mcp (no aws-lc-rs, so no NASM/MSVC toolchain requirement).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
# CertificateVerify signature verification for the from-scratch TLS 1.3 stack.
# Reuses the same `ring` build already locked by rustls's `ring` provider, so
# this adds no new toolchain requirement or supply-chain surface.
ring = "0.17"
# X.509 path validation (leaf -> intermediates -> trusted root) for the
# from-scratch TLS 1.3 stack. Reuses the same rustls-pki-types + ring signature
# algorithms already locked by rustls, so it adds no new crypto backend or
# toolchain requirement (no aws-lc-rs).
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std", "ring"] }
thiserror = "2"
log = "0.4"

[dev-dependencies]
tempfile = "3.8"
