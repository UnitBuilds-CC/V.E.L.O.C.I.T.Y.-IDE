# cargo-audit configuration
# See: https://github.com/RustSec/rustsec/tree/main/cargo-audit
#
# NOTE ON LOCATION: cargo-audit only auto-discovers this file at
# `~/.cargo/audit.toml` (user home) or `.cargo/audit.toml` (project root).
# It does NOT read a bare `audit.toml` at the repository root, so this file
# must stay under `.cargo/` for `cargo audit` (local and CI) to honor the
# ignores below.

[advisories]
# Each ignore below is a transitive dependency we cannot bump ourselves, paired
# with a reachability analysis showing the vulnerable code path is never
# exercised by this project. Revisit each when the pinning parent ships a fix.
#
# RUSTSEC-2026-0194 / RUSTSEC-2026-0195 (quick-xml 0.39.4):
#   Transitive dep from wayland-scanner (Linux-only GUI stack). wayland-scanner
#   pins quick-xml <0.40; fix requires upstream release. Not exploitable in our
#   project: wayland-scanner is a build-time code generator, and our targets are
#   Windows-only for the GUI stack (quick-xml 0.39.4 is not compiled for the
#   win-x64 target; the Windows tree resolves quick-xml 0.41.0).
#
# RUSTSEC-2024-0437 (protobuf 2.28.0):
#   Transitive dep of prometheus 0.13.4, which pins protobuf ^2 (no prometheus
#   release uses protobuf 3 yet). velocity-mcp uses prometheus ONLY through
#   TextEncoder to export in-process metrics in the Prometheus text format; it
#   never parses protobuf. The advisory is a crash from uncontrolled recursion
#   while *parsing* malformed protobuf input, so the vulnerable path is never
#   exercised. Drop this ignore once prometheus adopts protobuf >=3.7.2.
#
# RUSTSEC-2025-0141 (bincode 1.3.3):
#   Transitive dep of syntect 5.3.0 (already latest). bincode is unmaintained
#   but stable for our use case (serialization of syntax highlighting data).
#   No safe upgrade available; syntect would need to migrate to an alternative.
#
# RUSTSEC-2024-0436 (paste 1.0.15):
#   Transitive dep of egui_dock 0.20.1. egui_dock 0.21+ requires egui 0.36,
#   but we're pinned to egui 0.35 for compatibility with egui-phosphor and
#   other dependencies. paste is a proc-macro crate that's stable for our use.
#
# RUSTSEC-2026-0192 (ttf-parser 0.25.1):
#   Deep transitive dep from winit → ab_glyph → owned_ttf_parser. Linux-only
#   (sctk-adwaita is Linux-specific). Not compiled for win-x64 target.
#   No safe upgrade available; requires winit/ab_glyph upstream migration.
#
# RUSTSEC-2024-0320 (yaml-rust 0.4.5):
#   Transitive dep of syntect 5.3.0 (already latest). yaml-rust is unmaintained
#   but stable for parsing Sublime Text syntax definitions. No safe upgrade
#   available; syntect would need to migrate to yaml-rust2.
#
# RUSTSEC-2026-0221 (event-listener 5.4.1):
#   Deep transitive dep from zbus → async-broadcast (Unix accessibility stack).
#   Not compiled for win-x64 target. The unsoundness involves !Send tags
#   crossing thread boundaries via StackSlot, which is not exercised in our
#   Unix accessibility code paths.
ignore = [
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    "RUSTSEC-2024-0437",
    "RUSTSEC-2025-0141",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0192",
    "RUSTSEC-2024-0320",
    "RUSTSEC-2026-0221",
]
