[package]
name = "velocity-e2e"
version = "1.0.0"
publish = false
edition = "2021"
license = "LicenseRef-Proprietary"

# E2E tests are integration tests that spawn actual binaries.
# They live in tests/ and are run via `cargo test`.

[dependencies]
serde_json = "1"
tempfile = "3"

# These deps ensure the binaries are built before E2E tests run.
# The versions are explicit because a bare path dependency carries no
# requirement at all, which `cargo deny` reports as a wildcard (`*`).
velocity-ide = { path = "../velocity-ide", version = "1.0.0" }
velocity-browser = { path = "../velocity-browser", version = "1.0.0" }
velocity_mcp = { path = "../velocity-mcp", version = "1.0.0" }

[lints]
workspace = true
