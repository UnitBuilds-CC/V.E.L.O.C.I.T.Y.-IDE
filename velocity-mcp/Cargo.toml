[package]
name = "velocity_mcp"
version = "1.0.0"
edition = "2021"
authors = ["UnitBuilds <ian@unitbuilds.com>"]
description = "A high-performance, zero-allocation Model Context Protocol (MCP) server in Rust"

[dependencies]
pathdiff = "0.2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
sha2 = "0.10"
once_cell = "1.18"
eframe = "0.35.0"
egui = "0.35.0"
egui_dock = "0.20"
epaint = "0.35.0"
ropey = "1.6"
crossbeam-channel = "0.5"
dotenvy = "0.15"
ureq = { version = "2.9", features = ["json"] }
ash = "0.37.3"
gpu-allocator = "0.25.0"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
log = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

