[package]
name = "velocity_mcp"
version = "1.0.0"
edition = "2021"
authors = ["UnitBuilds <ian@unitbuilds.com>"]
description = "A high-performance, zero-allocation Model Context Protocol (MCP) server in Rust"
license = "LicenseRef-Proprietary"

[features]
default = ["full"]
full = []                          # Enable all modules (default for development)
plugins = []                       # Plugin system (PluginRegistry, PluginHandler, etc.)
collaboration = []                 # Real-time collaboration (sessions, conflict resolution)
webhooks = []                      # Webhook integration (GitHub, GitLab, Jira, etc.)
background_agents = []             # Background agent orchestration
connectors = []                    # External service connectors (sync rules, OAuth2)
benchmark_gpu = []                 # GPU benchmark suite (requires Vulkan/GPU)

[dependencies]
pathdiff = "0.2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
sha2 = "0.10"
base64 = "0.22"
hmac = "0.12"
crossbeam-channel = "0.5"
dotenvy = "0.15"
ureq = { version = "2.9", features = ["json"] }
ash = "0.37"
gpu-allocator = "0.25"
log = "0.4"
env_logger = "0.11"
tree-sitter = "0.20"
libloading = "0.8"
ctrlc = "3.4"
# Sibling crates: the version is spelled out because a bare path dependency
# carries no requirement at all, which `cargo deny` reports as a wildcard (`*`).
velocity-ide = { path = "../velocity-ide", version = "1.0.0" }
velocity-browser = { path = "../velocity-browser", version = "1.0.0" }
thiserror = "2"
dirs = "5"
notify = "8"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
eframe = "0.35.0"
egui = "0.35.0"
egui_dock = "0.20"
egui-phosphor = "0.13"
epaint = "0.35.0"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
portable-pty = "0.9"
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
getrandom = "0.3"
wasmer = "5"
wasmer-middlewares = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
tempfile = "3"
proptest = "1"

[lints]
workspace = true
