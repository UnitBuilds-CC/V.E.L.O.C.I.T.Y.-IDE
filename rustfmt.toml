# rustfmt configuration for Velocity IDE
# See: https://rust-lang.github.io/rustfmt/

edition = "2021"
max_width = 100
tab_spaces = 4
use_field_init_shorthand = true
use_try_shorthand = true
newline_style = "Unix"
reorder_imports = true
# NOTE: group_imports / imports_granularity are nightly-only options; omitted so
# the pinned stable toolchain (rust-toolchain.toml + CI fmt job) formats
# consistently instead of silently ignoring them with "unstable features" warnings.
