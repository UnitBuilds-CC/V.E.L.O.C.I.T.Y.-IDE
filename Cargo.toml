[workspace]
resolver = "2"
members = ["velocity-mcp", "velocity-ide", "velocity-ide-gui", "velocity-browser", "drone", "e2e"]

# Exclude archived & legacy dirs that are not Rust packages
exclude = ["archive", "bin", "scratch", "memory", ".velocity", "browsing", "fuzz", "shared", "Kimi-Code", "velocity-workflow-daemon"]

[workspace.lints.clippy]
# Every `unsafe` block/impl must carry an adjacent `// SAFETY:` comment stating the soundness
# invariants it relies on (FFI/GPU/JIT/crypto/shmem). Each member crate inherits this via
# `[lints] workspace = true`; `cargo clippy -- -D warnings` escalates it to a hard error.
undocumented_unsafe_blocks = "warn"

[profile.dev]
debug = 1              # Minimal line-table debug symbols (not full DWARF)
split-debuginfo = "unpacked"  # PDB in separate files → faster linking, smaller artifacts
opt-level = 0          # No optimization in dev — maximum compile speed
codegen-units = 512    # Maximum parallel codegen (dev only; trade runtime perf for compile speed)
incremental = true     # Already the default for dev, but explicit for clarity

# Zero debug info for third-party deps in dev — they rarely need stack traces
[profile.dev.package."*"]
debug = 0
opt-level = 0

# Fast proc-macro / build-script compilation — these don't benefit from optimization
[profile.dev.build-override]
opt-level = 0
codegen-units = 512

[profile.test]
codegen-units = 512    # Fast test compiles mirror dev
incremental = true

[profile.release]
strip = true           # Strip debug symbols from release binaries
lto = "thin"           # Thin LTO: good size reduction without excessive compile times
opt-level = "s"        # Optimize for size over speed
codegen-units = 16     # Parallel codegen for faster release builds
panic = "abort"        # Abort on panic (no unwinding overhead, smaller binaries)
split-debuginfo = "off" # No separate debug files in release
