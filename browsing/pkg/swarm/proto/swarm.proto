syntax = "proto3";

package swarm;

option go_package = "github.com/reclamation-admin/agentic-browser-go/pkg/swarm/proto";

// SwarmService runs on Node Agents to receive tasks.
service SwarmService {
  // SpawnAgent tells a node to start a new browser agent instance.
  rpc SpawnAgent (SpawnAgentRequest) returns (SpawnAgentResponse);
}

// OrchestratorService runs on the Global Orchestrator to receive node check-ins.
service OrchestratorService {
  // RegisterNode is called by a node when it joins the network.
  rpc RegisterNode (RegisterNodeRequest) returns (RegisterNodeResponse);
  
  // ReportHeartbeat is called periodically by nodes to report utilization.
  rpc ReportHeartbeat (HeartbeatRequest) returns (HeartbeatResponse);

  // RequestSecret is called by nodes when they need sensitive data (e.g. login).
  // This triggers a user authorization flow on the Orchestrator host.
  rpc RequestSecret (RequestSecretRequest) returns (RequestSecretResponse);

  // SubmitMission is called by an Initiator (e.g. Mobile) to start a new mission.
  rpc SubmitMission (SubmitMissionRequest) returns (SubmitMissionResponse);

  // GetSwarmStatus returns the live state of all registered nodes.
  rpc GetSwarmStatus (SwarmStatusRequest) returns (SwarmStatusResponse);

  // GetMissionResult returns the current status/result of a mission.
  rpc GetMissionResult (MissionResultRequest) returns (MissionResultResponse);
}

message SubmitMissionRequest {
  string url = 1;
  string instruction = 2;
  string mission_id = 3;
}

message SubmitMissionResponse {
  bool accepted = 1;
  string message = 2;
}

message RequestSecretRequest {
  string mission_id = 1;
  string site = 2;
  string secret_key = 3; // e.g. "password", "bank_account"
}

message RequestSecretResponse {
  bool authorized = 1;
  string secret_value = 2;
}

message SpawnAgentRequest {
  string url = 1;
  string system_instruction = 2;
  string mission_id = 3;
  string instance_id = 4;
}

message SpawnAgentResponse {
  bool success = 1;
  string message = 2;
  string result_json = 3;
  bytes screenshot = 4;
}

message RegisterNodeRequest {
  string endpoint = 1;
  string tier = 2; // "Rack", "PC", "Laptop"
  int32 max_simops = 3;
  repeated string loaded_models = 4;
}

message RegisterNodeResponse {
  bool success = 1;
  string message = 2;
}

message HeartbeatRequest {
  string endpoint = 1;
  int32 current_simops = 2;
  float cpu_utilization = 3;
}

message HeartbeatResponse {
  bool success = 1;
}

// --- Mobile Command Interface ---

message SwarmStatusRequest {}

message SwarmStatusResponse {
  repeated NodeStatus nodes = 1;
  int32 active_missions = 2;
}

message NodeStatus {
  string endpoint = 1;
  string tier = 2;
  float cpu_utilization = 3;
  int32 current_simops = 4;
  int64 last_seen_ms = 5;
}

message MissionResultRequest {
  string mission_id = 1;
}

message MissionResultResponse {
  string mission_id = 1;
  string status = 2;
  string result_json = 3;
  string dispatched_to = 4;
}
