# cargo-deny configuration for Velocity IDE
# See: https://embarkstudios.github.io/cargo-deny/

[advisories]
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
unmaintained = "all"
# Transitive advisories that cannot be bumped yet and whose vulnerable code path
# is never exercised by this project. Kept in lockstep with `.cargo/audit.toml`;
# see that file for the full per-advisory reachability analysis.
#   RUSTSEC-2024-0437 (protobuf 2.28.0): prometheus 0.13.4 is used via TextEncoder
#     only; the vulnerable protobuf *parsing* recursion path is never reached.
#   RUSTSEC-2026-0194 / RUSTSEC-2026-0195 (quick-xml 0.39.4): build-time dep of
#     wayland-scanner (Linux-only); not compiled for the win-x64 target.
#   RUSTSEC-2025-0141 (bincode): syntect 5.3.0 dep, unmaintained but stable.
#   RUSTSEC-2024-0436 (paste): egui_dock 0.20.1 dep, can't update without egui 0.36.
#   RUSTSEC-2026-0192 (ttf-parser): Linux-only deep transitive from winit.
#   RUSTSEC-2024-0320 (yaml-rust): syntect 5.3.0 dep, unmaintained but stable.
#   RUSTSEC-2026-0221 (event-listener): Unix-only deep transitive from zbus.
ignore = [
    "RUSTSEC-2024-0437",
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    "RUSTSEC-2025-0141",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0192",
    "RUSTSEC-2024-0320",
    "RUSTSEC-2026-0221",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "BSL-1.0",
    "OpenSSL",
    # Font licenses from epaint_default_fonts (egui default fonts)
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # Creative Commons Zero (hexf-parse via naga/wgpu, notify)
    "CC0-1.0",
    # Data license for webpki-roots (bundled CA certificates)
    "CDLA-Permissive-2.0",
    # Workspace crates are proprietary (see LICENSE file)
    "LicenseRef-Proprietary",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[sources.allow-org]
github = ["UnitBuilds"]
